name: Publish arm64 debug APK

on:
  push:
    branches: [main]
    paths:
      - ".github/release-source.url"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import source and publish v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          source_url=$(sed -n '1p' .github/release-source.url | tr -d '[:space:]')
          apk_url=$(sed -n '2p' .github/release-source.url | tr -d '[:space:]')
          curl -fL -X POST "$source_url" -o /tmp/stage-talk-source.tar.gz
          tar -xzf /tmp/stage-talk-source.tar.gz
          git add -A
          git rm -f --ignore-unmatch .github/release-source.url
          rm -f .github/release-source.url
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Publish Stage Talk source [skip ci]"
          git push
          curl -fL -X POST "$apk_url" -o /tmp/stage-talk-arm64-debug.apk
          echo "8da3298fa6ec98295ddd05d801d69c064511a7491e62dd81e44d8dce7831120e  /tmp/stage-talk-arm64-debug.apk" | sha256sum -c -
          gh release create v0.1.0 /tmp/stage-talk-arm64-debug.apk \
            --target main \
            --title "Stage Talk v0.1.0" \
            --notes "$(cat <<'EOF'
          Stage Talk 0.1.0 arm64 debug APK.

          Install on an arm64 Android phone that shares Wi-Fi with the booth. The launcher name is Stage Talk.

          SHA-256: 8da3298fa6ec98295ddd05d801d69c064511a7491e62dd81e44d8dce7831120e
          EOF
          )"
